<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Winding Way</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --night: #24152f; --plum: #4a2d6b; --cream: #f6e7d0;
      --gold: #e8b563; --rose: #d9798b;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--cream); font-family: var(--serif); }
    #frame { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #game, #debug { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #debug { touch-action: none; }
    #debug-panel {
      position: fixed; left: 14px; top: 14px; width: 250px; padding: 12px 14px; border-radius: 12px;
      background: rgba(36, 21, 47, 0.9); border: 1px solid rgba(232, 181, 99, 0.4);
      font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    #debug-panel b { color: var(--gold); }
    #debug-panel input { width: 54px; margin: 0 8px 0 4px; }
    #debug-panel button { margin: 8px 6px 0 0; padding: 4px 9px; border-radius: 7px; border: 0; background: var(--cream); color: var(--night); cursor: pointer; font: inherit; }
    .hidden { display: none !important; }

    #select {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      background: radial-gradient(ellipse at center, rgba(74, 45, 107, 0.82), rgba(36, 21, 47, 0.96));
      backdrop-filter: blur(6px);
    }
    #select h1 { margin: 0; font-size: 56px; font-weight: 500; letter-spacing: 0.02em; color: var(--gold); }
    #select p { margin: 0 0 20px; font-size: 20px; font-style: italic; opacity: 0.9; }
    #cards { display: flex; gap: 28px; }
    .card {
      width: 190px; padding: 22px 18px 16px; border-radius: 22px; cursor: pointer;
      border: 2px solid rgba(232, 181, 99, 0.35); background: rgba(246, 231, 208, 0.08);
      color: var(--cream); font: 22px var(--serif);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }
    .card img { height: 190px; }
    .card:hover, .card:focus-visible {
      outline: none; transform: translateY(-6px); border-color: var(--gold); background: rgba(246, 231, 208, 0.16);
    }
    #select small { margin-top: 18px; font-size: 14px; opacity: 0.65; }

    #hud {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      display: flex; gap: 22px; padding: 10px 22px; border-radius: 999px;
      background: rgba(36, 21, 47, 0.72); border: 1px solid rgba(232, 181, 99, 0.3);
      font-size: 15px; white-space: nowrap;
    }
    #hud kbd {
      font: 13px ui-monospace, Menlo, monospace; color: var(--night); background: var(--cream);
      padding: 2px 7px; border-radius: 6px; margin-right: 6px;
    }
    /* Speech bubbles: hints above the player, the partner's remarks above the partner. */
    .bubble {
      position: fixed; left: 0; top: 0; max-width: 250px; padding: 8px 14px; border-radius: 14px; text-align: center;
      font-size: 15px; line-height: 1.3; font-style: italic; pointer-events: none; z-index: 3;
      background: rgba(36, 21, 47, 0.92); border: 1px solid rgba(232, 181, 99, 0.6); box-shadow: 0 4px 14px rgba(20, 10, 28, 0.45);
      opacity: 0; transition: opacity 0.7s ease;
    }
    .bubble.on { opacity: 1; transition: opacity 0.45s ease; }
    .bubble::after {
      content: ""; position: absolute; left: var(--tail, 50%); bottom: -6px; width: 10px; height: 10px; margin-left: -5px;
      background: rgb(40, 24, 52); border-right: 1px solid rgba(232, 181, 99, 0.6); border-bottom: 1px solid rgba(232, 181, 99, 0.6);
      transform: rotate(45deg);
    }
    #partner-bubble { font-size: 13px; padding: 5px 12px; }
    /* The story: painted intro and ending, drawn over the game inside the same frame. */
    #frame { overflow: hidden; }
    #story { position: absolute; inset: 0; overflow: hidden; z-index: 5; }
    #story-back { position: absolute; inset: 0; background: var(--night); }
    #story-layers, .story-layer, #story-flood, .story-flicker { position: absolute; inset: 0; }
    .story-layer { opacity: 0; overflow: hidden; }
    .story-cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .story-cam img, .story-cam svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .story-flicker {
      background: radial-gradient(ellipse at 50% 55%, rgba(255, 214, 150, 0.38), rgba(255, 190, 120, 0.08) 55%, rgba(60, 20, 70, 0.22));
      mix-blend-mode: soft-light; animation: story-flicker 6.5s ease-in-out infinite;
    }
    @keyframes story-flicker { 0%, 100% { opacity: 0.55; } 18% { opacity: 0.9; } 31% { opacity: 0.62; } 47% { opacity: 1; } 63% { opacity: 0.7; } 80% { opacity: 0.92; } }
    #story-flood { opacity: 0; background: radial-gradient(ellipse at 85% 30%, #fff6dc, #ffe2a8 45%, #f6c98a); }
    .story-thread { fill: none; stroke: #cf2a44; stroke-width: 2.2; stroke-linecap: round; }
    .story-thread-shade { fill: none; stroke: rgba(70, 14, 34, 0.45); stroke-width: 3.6; stroke-linecap: round; transform: translate(0.8px, 1.4px); }
    .story-bow-line { fill: none; stroke: #e2334f; stroke-width: 5.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
    .story-bow-shade { fill: none; stroke: rgba(84, 14, 38, 0.6); stroke-width: 8.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transform: translate(1px, 2px); }
    .story-bow-knot { fill: #b31f3a; opacity: 0; transition: opacity 0.6s ease 2.6s; }
    .tied .story-bow-knot { opacity: 1; }
    .story-sparkle { opacity: 0; }
    .tied .story-sparkle { opacity: 1; transition: opacity 0.4s ease 3.4s; }
    .story-sparkle path { fill: #fff3c4; transform: scale(0); }
    .tied .story-sparkle path { animation: story-twinkle 1.5s ease-in-out 3.4s 3 both; }
    .story-sparkle-glow { fill: rgba(255, 232, 170, 0.5); filter: blur(14px); opacity: 0; }
    .tied .story-sparkle-glow { animation: story-glow 3.6s ease-in-out 3.3s both; }
    @keyframes story-twinkle { 0%, 100% { transform: scale(0) rotate(0deg); } 50% { transform: scale(1) rotate(45deg); } }
    @keyframes story-glow { 0%, 100% { opacity: 0; } 35% { opacity: 1; } }
    #story-title, #story-end {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      opacity: 0; pointer-events: none; text-align: center;
    }
    #story-title { background: radial-gradient(ellipse at center, rgba(36, 21, 47, 0.62), rgba(36, 21, 47, 0.2) 70%); }
    #story-title h1 { margin: 0; font-size: clamp(40px, 6.4vw, 92px); font-weight: 500; letter-spacing: 0.03em; color: var(--gold); text-shadow: 0 3px 22px rgba(20, 8, 30, 0.85); }
    #story-title p { margin: 0; font-size: 19px; font-style: italic; text-shadow: 0 2px 10px rgba(20, 8, 30, 0.9); animation: story-breathe 3s ease-in-out infinite; }
    @keyframes story-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    #story-caption {
      position: absolute; left: 50%; top: 5%; transform: translateX(-50%); width: max-content; max-width: 78%;
      padding: 14px 30px; border-radius: 18px; text-align: center; font-size: clamp(17px, 1.9vw, 26px); font-style: italic; line-height: 1.4;
      background: rgba(36, 21, 47, 0.82); border: 1px solid rgba(232, 181, 99, 0.45); box-shadow: 0 6px 24px rgba(20, 10, 28, 0.4);
      opacity: 0; pointer-events: none;
    }
    #story-skip { position: absolute; right: 18px; bottom: 14px; font-size: 13px; font-style: italic; opacity: 0; color: var(--cream); text-shadow: 0 1px 6px rgba(20, 8, 30, 0.95); pointer-events: none; }
    #story-end { background: radial-gradient(ellipse at center, rgba(36, 21, 47, 0.5), rgba(36, 21, 47, 0.86)); gap: 18px; }
    #story-end.on { pointer-events: auto; }
    #story-end.no-portrait { justify-content: flex-end; padding-bottom: 5%; gap: 12px; background: linear-gradient(to bottom, rgba(36, 21, 47, 0) 45%, rgba(36, 21, 47, 0.88) 88%); }
    #story-portrait img { display: block; max-height: 52vh; max-width: 60vw; border-radius: 18px; border: 3px solid rgba(232, 181, 99, 0.7); box-shadow: 0 12px 40px rgba(15, 6, 22, 0.6); }
    #story-end h2 { margin: 0; font-size: clamp(34px, 4.6vw, 64px); font-weight: 500; color: var(--gold); text-shadow: 0 3px 18px rgba(20, 8, 30, 0.9); }
    #story-again {
      padding: 10px 30px; border-radius: 999px; cursor: pointer; font: italic 20px var(--serif);
      color: var(--cream); background: rgba(246, 231, 208, 0.1); border: 2px solid rgba(232, 181, 99, 0.6);
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }
    #story-again:hover, #story-again:focus-visible { outline: none; transform: translateY(-3px); background: rgba(246, 231, 208, 0.22); border-color: var(--gold); }
    .in-story #hud, .in-story .bubble, .in-story #partner-label { opacity: 0 !important; transition: opacity 0.8s ease; }
    #select { animation: story-arrive 1s ease both; }
    @keyframes story-arrive { from { opacity: 0; } to { opacity: 1; } }
    #partner-label {
      position: fixed; left: 0; top: 0; pointer-events: none;
      box-shadow: 0 2px 6px rgba(36, 21, 47, 0.35);
      padding: 1px 8px; border-radius: 999px; font-size: 11px; font-style: italic; opacity: 0;
      background: var(--cream); color: var(--plum); border: 1px solid var(--plum);
      transition: background 0.2s ease, opacity 0.45s ease;
    }
    #partner-label.on { opacity: 1; transition: background 0.2s ease, opacity 0.12s ease; }
    #partner-label[data-mode="hold"] { background: var(--gold); }
    #partner-label[data-mode="come"] { background: var(--rose); color: #fff; }
  </style>
</head>
<body>
  <div id="frame">
    <canvas id="game"></canvas>
    <svg id="debug" class="hidden"></svg>
    <div id="story" class="hidden">
      <div id="story-back"></div>
      <div id="story-layers"></div>
      <div id="story-flood"></div>
      <div id="story-title"><h1>The Winding Way</h1><p>press any key to begin</p></div>
      <div id="story-caption"></div>
      <div id="story-skip">Space or click to skip</div>
      <div id="story-end">
        <div id="story-portrait"></div>
        <h2>You found her.</h2>
        <button id="story-again">Play again</button>
      </div>
    </div>
  </div>
  <div id="debug-panel" class="hidden"></div>

  <div id="select" class="hidden">
    <h1>The Winding Way</h1>
    <p>Who will you walk as?</p>
    <div id="cards"></div>
    <small>The other one comes with you, on the same thread.</small>
  </div>

  <div id="hud" class="hidden">
    <span><kbd>WASD</kbd>or arrows to move</span>
    <span><kbd>Space</kbd>call</span>
    <span><kbd>H</kbd>hold / follow</span>
    <span><kbd>R</kbd>start again</span>
    <span><kbd>M</kbd>mute</span>
  </div>
  <div id="partner-label" class="hidden"></div>
  <div id="hint" class="bubble"><span></span></div>
  <div id="partner-bubble" class="bubble"><span></span></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
